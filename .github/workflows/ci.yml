name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev --locked
      - run: uv run ruff check --output-format=github .

  test:
    # CI has no FL Studio, so this suite runs entirely against the fakes in
    # tests/fakes. Windows matters most: it has no virtual MIDI API, so any test
    # that quietly depends on one fails there and not on the developer's Mac.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --dev --locked
      - run: uv run pytest -v
